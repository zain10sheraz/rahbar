# Copy this file to corpus/sources.yaml, keep the documents you want, drop or add
# others, then run:  python corpus/fetch.py
#
# Every entry needs a name and a url. doc_version and superseded become chunk
# metadata (section 3.1): they are how your retriever tells the current rule from
# the repealed one.
#
# These FAST-NUCES documents were checked on 1 November 2026. Websites change:
# confirm each one downloads, and check the file is what its name says.
# Find more with:  python corpus/fetch.py --list https://www.nu.edu.pk/Downloads

documents:

  # Property 2: two versions of one policy (and 7: exact clause numbers)
  - name: Undergraduate Academic Rules (Aug 2023)
    url: http://nu.edu.pk/public/downloads/Academic-Rules-Undergrad-Aug-2023.pdf
    doc_version: "2023-08"
    superseded: true
    notes: Still linked from /Student/RulesUndergrad. Did not open on 1 Nov 2026; confirm it downloads.

  - name: Academic Rules Handbook (Jun 2026)
    url: https://nu.edu.pk/public/downloads/Academic_Rules_Handbook_2026.pdf
    doc_version: "2026-06"
    superseded: false
    notes: About 53 pages, numbered clauses (attendance 1.21, academic warning 5.4).

  - name: Prospectus 2026 - Academic Rules and Regulations
    url: https://nu.edu.pk/Admissions/ProspectusUpload/Academic Rules and Regulations.pdf
    doc_version: "2026"
    superseded: false
    notes: The same rules in 5 pages with different clause numbers (attendance is clause 1 here).

  # Property 5: long definitions
  - name: Student Handbook (Jun 2026)
    url: https://nu.edu.pk/public/downloads/Student_Handbook_2026.pdf
    doc_version: "2026-06"
    superseded: false

  # Property 4: tables, and versions over time
  - name: Annual Report 2019-20
    url: https://nu.edu.pk/public/downloads/AnnualReportForm/Annual Report 2019-20.pdf
    doc_version: "2019-20"
    superseded: false

  - name: Annual Report 2023-24
    url: https://nu.edu.pk/public/downloads/AnnualReportForm/Annual Report 2023-24.pdf
    doc_version: "2023-24"
    superseded: false

  # Property 4: tables in HTML pages (your extract stage must handle .html)
  - name: Fee Structure page
    url: https://www.nu.edu.pk/Admissions/FeeStructure
    doc_version: "2026-27"
    superseded: false

  - name: Grading page
    url: https://www.nu.edu.pk/Student/Grading
    doc_version: "2026"
    superseded: false

  # Property 3: probably scanned (no text came back on 1 Nov 2026).
  # Confirm with:  pdffonts corpus/raw/<file>.pdf   (an empty font list means image-only)
  - name: Faculty Entrepreneurship and Technical Start-ups Policy
    url: https://nu.edu.pk/OricResources/ResearchPolicies/27.pdf?20220530
    doc_version: "2022-05"
    superseded: false

  # Property 6: a deliberately absent topic. Leave the document that covers it OUT,
  # and write must-abstain golden questions about it. Example: hostel rules.
  # - name: Prospectus - Transport and Hostel Facilities
