apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# CI overlay (kind cluster on a GitHub runner): no Ollama, no real corpus, no hostPath.
#   - stub LLM and dummy embeddings, so the pipeline runs end to end without a model
#   - the indexer Job runs in --dummy mode and does not mount the corpus hostPath
namespace: rahbar

resources:
  - ../../base

patches:
  - target:
      kind: ConfigMap
      name: rahbar-config
    patch: |-
      - op: replace
        path: /data/LLM_PROVIDER
        value: "stub"
      - op: replace
        path: /data/EMBED_MODEL
        value: "dummy-768"
  - target:
      kind: Job
      name: indexer
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args
        value: ["--dummy"]
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts/1
      - op: remove
        path: /spec/template/spec/volumes/1
