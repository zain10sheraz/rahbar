apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rahbar-ingress
  namespace: rahbar
spec:
  ingressClassName: nginx
  rules:
    - host: rahbar.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 8080
