apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
  namespace: rahbar
data:
  # Retriever & LLM provider settings
  RETRIEVER: "stub"
  LLM_PROVIDER: "stub"
  LLM_MODEL: "llama3.2:3b"

  # Embedding pin: indexer writes it into Chroma metadata, API checks at startup
  EMBED_MODEL: "dummy-768"

  # Chroma vector store
  CHROMA_HOST: "chroma"
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: "rahbar"

  # Redis semantic cache
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  CACHE_THRESHOLD: "0.9"

  # Retrieval and generation parameters
  TOP_K: "5"
  RELEVANCE_FLOOR: "0.5"
  TEMPERATURE: "0.2"

  # External service URLs
  OLLAMA_URL: "http://host.minikube.internal:11434"
  HOSTED_BASE_URL: "https://api.groq.com/openai/v1"

  # Indexer parameters
  CHUNK_SIZE: "400"
  CHUNK_OVERLAP: "50"
  CORPUS_DIR: "/corpus"
  LOG_LEVEL: "INFO"
