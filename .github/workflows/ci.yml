name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Python linter
        run: |
          pip install ruff
          ruff check --select E,F,W --ignore E501 api/ indexer/ eval/

  manifests:
    runs-on: ubuntu-latest
    needs: lint
    env:
      KUBECONFORM_VERSION: v0.6.7
      KUBERNETES_VERSION: 1.30.0
    steps:
      - uses: actions/checkout@v4
      # yannh/kubeconform-action does not exist; kubeconform ships as a release binary,
      # so download a pinned version and verify its checksum.
      - name: Install kubeconform
        run: |
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -fsSLO "${base}/kubeconform-linux-amd64.tar.gz"
          curl -fsSLO "${base}/CHECKSUMS"
          grep ' kubeconform-linux-amd64.tar.gz$' CHECKSUMS | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform
      - name: Validate rendered dev and prod overlays
        run: |
          for overlay in dev prod ci; do
            echo "== ${overlay}"
            kubectl kustomize "k8s/overlays/${overlay}"               | kubeconform -strict -summary -ignore-missing-schemas                   -kubernetes-version "${KUBERNETES_VERSION}" -
          done

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      - name: Run pytest
        run: |
          . .venv/bin/activate
          PYTHONPATH=api:indexer pytest api/tests indexer/tests -v

  scan:
    runs-on: ubuntu-latest
    needs: [test, manifests]
    steps:
      - uses: actions/checkout@v4
      - name: Build local images for scanning
        run: |
          docker build -t rahbar-api:${{ github.sha }} api
          docker build -t rahbar-indexer:${{ github.sha }} indexer
      # Run Trivy from its pinned image: trivy-action pulls in setup-trivy, whose tag
      # no longer resolves. exit-code 0 reports findings without failing the build.
      - name: Trivy vulnerability scan
        run: |
          for image in rahbar-api rahbar-indexer; do
            echo "== ${image}"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.57.1 image --severity CRITICAL,HIGH --exit-code 0 \
              "${image}:${{ github.sha }}"
          done

  e2e-eval:
    runs-on: ubuntu-latest
    needs: [test, manifests]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kind
      # The manifests reference rahbar-*:dev with imagePullPolicy IfNotPresent.
      - name: Build and load images
        run: |
          docker build -t rahbar-api:dev api
          docker build -t rahbar-indexer:dev indexer
          docker build -t rahbar-ui:dev ui
          kind load docker-image rahbar-api:dev rahbar-indexer:dev rahbar-ui:dev --name kind
      # CI overlay: stub LLM, dummy embeddings, dummy indexer (no Ollama on the runner).
      - name: Deploy application
        run: |
          kubectl apply -k k8s/overlays/ci
          kubectl rollout status statefulset/chroma -n rahbar --timeout=180s
          kubectl rollout status deployment/redis -n rahbar --timeout=120s
      # The API only becomes ready once the collection is non-empty, so index first.
      - name: Wait for the indexer Job
        run: |
          kubectl wait --for=condition=complete job/indexer -n rahbar --timeout=180s             || { kubectl logs job/indexer -n rahbar --tail=50; exit 1; }
          kubectl rollout status deployment/api -n rahbar --timeout=180s
      - name: Smoke test the API
        run: |
          kubectl port-forward -n rahbar svc/api 8000:8000 &
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/readyz >/dev/null && break
            sleep 2
          done
          curl -fs http://localhost:8000/healthz
          curl -fs http://localhost:8000/readyz
          curl -fs -X POST http://localhost:8000/api/ask             -H 'Content-Type: application/json'             -d '{"question": "What is the attendance requirement?"}' | tee ask.json
          python3 -c "import json; r = json.load(open('ask.json')); assert {'answer', 'citations', 'retrieved', 'answered_from_context'} <= r.keys(), r"
      # Non-blocking until a real model runs in CI: with the stub LLM and dummy
      # embeddings, retrieval quality and abstention are not meaningful.
      - name: Run evaluation (fixture golden set)
        continue-on-error: true
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install httpx pyyaml
          python eval/run_eval.py --api http://localhost:8000 --golden eval/fixtures/golden.fixture.yaml --baseline /nonexistent --out eval-results.json
      - name: Show pod state on failure
        if: failure()
        run: |
          kubectl get pods -n rahbar
          kubectl describe pods -n rahbar | tail -60
          kubectl logs deployment/api -n rahbar --tail=40 || true
