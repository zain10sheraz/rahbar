name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Python linter
        run: |
          pip install ruff
          ruff check --select E,F,W --ignore E501 api/ indexer/ eval/

  manifests:
    runs-on: ubuntu-latest
    needs: lint
    env:
      KUBECONFORM_VERSION: v0.6.7
      KUBERNETES_VERSION: 1.30.0
    steps:
      - uses: actions/checkout@v4
      # yannh/kubeconform-action does not exist; kubeconform ships as a release binary,
      # so download a pinned version and verify its checksum.
      - name: Install kubeconform
        run: |
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -fsSLO "${base}/kubeconform-linux-amd64.tar.gz"
          curl -fsSLO "${base}/CHECKSUMS"
          grep ' kubeconform-linux-amd64.tar.gz$' CHECKSUMS | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform
      - name: Validate rendered dev and prod overlays
        run: |
          for overlay in dev prod; do
            echo "== ${overlay}"
            kubectl kustomize "k8s/overlays/${overlay}"               | kubeconform -strict -summary -ignore-missing-schemas                   -kubernetes-version "${KUBERNETES_VERSION}" -
          done

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      - name: Run pytest
        run: |
          . .venv/bin/activate
          PYTHONPATH=api:indexer pytest api/tests indexer/tests -v

  scan:
    runs-on: ubuntu-latest
    needs: [test, manifests]
    steps:
      - uses: actions/checkout@v4
      - name: Build local images for scanning
        run: |
          docker build -t rahbar-api:${{ github.sha }} api
          docker build -t rahbar-indexer:${{ github.sha }} indexer
      # Run Trivy from its pinned image: trivy-action pulls in setup-trivy, whose tag
      # no longer resolves. exit-code 0 reports findings without failing the build.
      - name: Trivy vulnerability scan
        run: |
          for image in rahbar-api rahbar-indexer; do
            echo "== ${image}"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.57.1 image --severity CRITICAL,HIGH --exit-code 0 \
              "${image}:${{ github.sha }}"
          done

  e2e-eval:
    runs-on: ubuntu-latest
    needs: [test, manifests]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kind
      - name: Build and load test images
        run: |
          docker build -t rahbar-api:${{ github.sha }} api
          docker build -t rahbar-indexer:${{ github.sha }} indexer
          docker build -t rahbar-ui:${{ github.sha }} ui
          kind load docker-image rahbar-api:${{ github.sha }}
          kind load docker-image rahbar-indexer:${{ github.sha }}
          kind load docker-image rahbar-ui:${{ github.sha }}
      - name: Deploy application
        run: |
          kubectl apply -k k8s/overlays/dev
          kubectl rollout status deployment/rahbar-api -n rahbar --timeout=180s
      - name: Run indexer Job on fixture corpus
        run: |
          kubectl apply -f k8s/base/job-indexer.yaml
          kubectl wait --for=condition=complete job/rahbar-indexer -n rahbar --timeout=120s
      - name: Run evaluation regression gate
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install httpx pyyaml
          python eval/run_eval.py --api http://localhost:8000 --golden eval/fixtures/golden.fixture.yaml
