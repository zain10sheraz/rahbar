name: CI

# Spec section 6: every pull request to main, and every push to dev.
on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # kubeconform has no GitHub Action (yannh/kubeconform-action does not exist); it ships as
  # a release binary, so download a pinned version and check its sha256 before using it.
  manifests:
    name: manifests
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.6.7
      KUBERNETES_VERSION: 1.30.0
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -fsSLO "${base}/kubeconform-linux-amd64.tar.gz"
          curl -fsSLO "${base}/CHECKSUMS"
          grep ' kubeconform-linux-amd64.tar.gz$' CHECKSUMS | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform
      - name: Validate rendered dev and prod overlays
        run: |
          for overlay in dev prod; do
            echo "== ${overlay}"
            kubectl kustomize "k8s/overlays/${overlay}" \
              | kubeconform -strict -summary -ignore-missing-schemas \
                  -kubernetes-version "${KUBERNETES_VERSION}" -
          done

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements-dev.txt
            indexer/requirements-dev.txt
      - name: Install dependencies
        run: pip install pytest-cov==6.1.1 -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      # Stub retriever + stub provider: no network, no model (see api/tests).
      - name: API tests with 60% coverage gate on the app package
        working-directory: api
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=60
      - name: Indexer tests
        working-directory: indexer
        run: pytest -q
